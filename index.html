<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow" />
	<meta name="color-scheme" content="light dark" />

	<title>XR Lab Events</title>
	<link rel="icon" href="assets/xr-lab-logo.png" />

	<!--
		Theme / layout options come from the URL, so each iframe embed can pick
		its own look without any code changes:

		  ?theme=dark     Force dark mode (colors taken from the XR Lab logo)
		  ?theme=light    Force light mode
		  (no theme)      Follow the viewer's system setting, with a toggle button
		  ?header=off     Hide the logo/title header (useful when the host page
		                  already has its own heading)

		Options combine, e.g. index.html?theme=dark&header=off

		This runs before the page paints so there's no flash of the wrong theme.
	-->
	<script>
		(function () {
			const params = new URLSearchParams(location.search);
			const root = document.documentElement;
			const theme = (params.get("theme") || "").toLowerCase();

			if (theme === "dark" || theme === "light") {
				root.dataset.theme = theme;
				root.dataset.themeLocked = "true";
			} else {
				root.dataset.theme =
					window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
						? "dark"
						: "light";
			}

			const header = (params.get("header") || "").toLowerCase();
			if (header === "off" || header === "0" || header === "false") {
				root.dataset.header = "off";
			}
		})();
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />

	<style>
		/* ---------------------------------------------------------------
		   Theme tokens
		   --------------------------------------------------------------- */

		:root,
		:root[data-theme="light"] {
			color-scheme: light;
			--bg: #f4f6fb;
			--surface: #ffffff;
			--surface-alt: #eef2f8;
			--text: #1b2333;
			--heading: #0b1f3a;
			--muted: #5b6b82;
			--border: #d9e0ea;
			--accent: #f5c400;           /* XR Lab gold — decorative only on light bg */
			--accent-strong: #0b1f3a;    /* readable accent for text/buttons */
			--button-bg: #0b1f3a;
			--button-text: #ffffff;
			--button-hover: #17365f;
			--badge-bg: #0b1f3a;
			--badge-text: #ffffff;
			--badge-month: #f5c400;
			--shadow: 0 1px 2px rgba(11, 31, 58, 0.06), 0 6px 20px rgba(11, 31, 58, 0.06);
			--image-bg: #e7ecf3;
			--overlay: rgba(11, 31, 58, 0.85);
			--error: #b42318;
			--stars: none;
		}

		:root[data-theme="dark"] {
			color-scheme: dark;
			--bg: #061229;
			--surface: #0c1f40;
			--surface-alt: #102852;
			--text: #e6ecf7;
			--heading: #ffffff;
			--muted: #9fb0cc;
			--border: rgba(255, 255, 255, 0.10);
			--accent: #ffd21f;
			--accent-strong: #ffd21f;
			--button-bg: #ffd21f;
			--button-text: #061229;
			--button-hover: #ffe066;
			--badge-bg: #ffd21f;
			--badge-text: #061229;
			--badge-month: #061229;
			--shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.35);
			--image-bg: #081834;
			--overlay: rgba(3, 9, 22, 0.9);
			--error: #ff8a80;
			/* Faint starfield, echoing the logo background */
			--stars:
				radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, 0.55), transparent 60%),
				radial-gradient(1px 1px at 72% 9%, rgba(255, 255, 255, 0.45), transparent 60%),
				radial-gradient(1.5px 1.5px at 34% 62%, rgba(255, 210, 31, 0.55), transparent 60%),
				radial-gradient(1px 1px at 88% 44%, rgba(255, 255, 255, 0.4), transparent 60%),
				radial-gradient(1px 1px at 52% 86%, rgba(255, 255, 255, 0.35), transparent 60%),
				radial-gradient(1.5px 1.5px at 6% 78%, rgba(255, 210, 31, 0.4), transparent 60%),
				radial-gradient(1px 1px at 94% 92%, rgba(255, 255, 255, 0.4), transparent 60%),
				radial-gradient(1px 1px at 24% 38%, rgba(255, 255, 255, 0.3), transparent 60%);
		}

		/* ---------------------------------------------------------------
		   Base
		   --------------------------------------------------------------- */

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			padding: 0;
		}

		body {
			background-color: var(--bg);
			background-image: var(--stars);
			background-size: 420px 420px;
			color: var(--text);
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
			line-height: 1.55;
			-webkit-font-smoothing: antialiased;
		}

		h1, h2, h3,
		.date-badge,
		.event-button {
			font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
		}

		.container {
			max-width: 1000px;
			margin: 0 auto;
			padding: 24px 16px 40px;
		}

		/* ---------------------------------------------------------------
		   Header
		   --------------------------------------------------------------- */

		.header {
			display: flex;
			align-items: center;
			gap: 14px;
			margin-bottom: 24px;
		}

		:root[data-header="off"] .header {
			display: none;
		}

		.header-logo {
			width: 56px;
			height: 56px;
			flex: none;
			border-radius: 50%;
			box-shadow: 0 0 0 2px var(--accent);
		}

		.header-text {
			flex: 1;
			min-width: 0;
		}

		.header-eyebrow {
			margin: 0;
			color: var(--muted);
			font-size: 0.8rem;
			font-weight: 600;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		.header h1 {
			margin: 0;
			color: var(--heading);
			font-size: 1.6rem;
			font-weight: 800;
			line-height: 1.2;
		}

		.theme-toggle {
			flex: none;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 40px;
			height: 40px;
			padding: 0;
			border: 1px solid var(--border);
			border-radius: 50%;
			background: var(--surface);
			color: var(--heading);
			cursor: pointer;
		}

		.theme-toggle:hover {
			border-color: var(--accent);
		}

		.theme-toggle svg {
			width: 20px;
			height: 20px;
		}

		.theme-toggle .icon-sun { display: none; }
		:root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
		:root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

		/* Embeds that pin a theme don't show the toggle */
		:root[data-theme-locked="true"] .theme-toggle {
			display: none;
		}

		/* ---------------------------------------------------------------
		   Events list
		   --------------------------------------------------------------- */

		.events-list {
			display: grid;
			grid-template-columns: 1fr;
			gap: 18px;
		}

		.month-heading {
			display: flex;
			align-items: center;
			gap: 12px;
			margin: 0;
			color: var(--heading);
			font-size: 0.95rem;
			font-weight: 700;
			letter-spacing: 0.1em;
			text-transform: uppercase;
		}

		.month-heading::after {
			content: "";
			flex: 1;
			height: 2px;
			border-radius: 2px;
			background: linear-gradient(90deg, var(--accent), transparent);
		}

		.month-heading:not(:first-child) {
			margin-top: 14px;
		}

		.event-card {
			display: flex;
			flex-direction: row;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 16px;
			overflow: hidden;
			box-shadow: var(--shadow);
		}

		.event-image-wrap {
			position: relative;
			display: flex;
			flex: 0 0 280px;
			align-items: center;
			justify-content: center;
			background: var(--image-bg);
			min-height: 200px;
			overflow: hidden;
		}

		.flyer-trigger {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
			padding: 0;
			border: none;
			background: none;
			cursor: zoom-in;
		}

		.flyer-trigger:focus-visible {
			outline: 3px solid var(--accent);
			outline-offset: -3px;
		}

		.flyer-zoom-hint {
			position: absolute;
			bottom: 10px;
			right: 10px;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 30px;
			height: 30px;
			border-radius: 50%;
			background: rgba(6, 18, 41, 0.8);
			color: #ffd21f;
			pointer-events: none;
		}

		.flyer-zoom-hint svg {
			width: 16px;
			height: 16px;
		}

		.event-image {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		.event-content {
			display: flex;
			flex-direction: column;
			flex: 1;
			min-width: 0;
			padding: 22px;
		}

		.event-head {
			display: flex;
			align-items: flex-start;
			gap: 14px;
			margin-bottom: 14px;
		}

		.date-badge {
			display: flex;
			flex: none;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			width: 58px;
			padding: 6px 0 7px;
			border-radius: 10px;
			background: var(--badge-bg);
			color: var(--badge-text);
			line-height: 1;
		}

		.date-badge-month {
			color: var(--badge-month);
			font-size: 0.7rem;
			font-weight: 700;
			letter-spacing: 0.1em;
			text-transform: uppercase;
		}

		.date-badge-day {
			margin-top: 4px;
			font-size: 1.5rem;
			font-weight: 800;
		}

		.event-title {
			margin: 0;
			align-self: center;
			color: var(--heading);
			font-size: 1.3rem;
			font-weight: 700;
			line-height: 1.25;
		}

		.event-details {
			margin: 0 0 16px;
			padding: 0;
			list-style: none;
		}

		.event-details li {
			margin-bottom: 6px;
		}

		.event-details strong {
			color: var(--heading);
			font-weight: 600;
		}

		.event-description {
			margin: 0 0 18px;
			color: var(--text);
		}

		.event-button {
			display: inline-block;
			align-self: flex-start;
			margin-top: auto;
			padding: 10px 20px;
			background: var(--button-bg);
			color: var(--button-text);
			text-decoration: none;
			border-radius: 999px;
			font-size: 0.95rem;
			font-weight: 700;
			transition: background-color 0.15s ease;
		}

		.event-button:hover,
		.event-button:focus-visible {
			background: var(--button-hover);
		}

		.event-button::after {
			content: " →";
		}

		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		a:focus-visible,
		button:focus-visible {
			outline: 3px solid var(--accent);
			outline-offset: 2px;
		}

		/* ---------------------------------------------------------------
		   Empty / error states
		   --------------------------------------------------------------- */

		.notice {
			background: var(--surface);
			border: 1px solid var(--border);
			border-left: 6px solid var(--accent);
			border-radius: 12px;
			padding: 24px;
			box-shadow: var(--shadow);
		}

		.notice h2 {
			margin: 0 0 6px;
			color: var(--heading);
			font-size: 1.2rem;
		}

		.notice p {
			margin: 0;
			color: var(--muted);
		}

		.notice.load-error {
			border-left-color: var(--error);
		}

		.notice.load-error h2 {
			color: var(--error);
		}

		.noscript-message {
			max-width: 1000px;
			margin: 24px auto;
			padding: 16px;
			background: var(--surface);
			color: var(--text);
			border: 1px solid var(--border);
			border-left: 6px solid var(--accent);
			border-radius: 12px;
		}

		/* ---------------------------------------------------------------
		   Lightbox
		   --------------------------------------------------------------- */

		.lightbox-overlay {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: var(--overlay);
			z-index: 1000;
		}

		.lightbox-overlay[hidden] {
			display: none;
		}

		.lightbox-content {
			position: relative;
			max-width: 100%;
			max-height: 100%;
		}

		.lightbox-image {
			display: block;
			max-width: 100%;
			max-height: 90vh;
			border-radius: 10px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
		}

		.lightbox-close {
			position: absolute;
			top: -14px;
			right: -14px;
			width: 36px;
			height: 36px;
			display: flex;
			align-items: center;
			justify-content: center;
			border: none;
			border-radius: 50%;
			background: #ffd21f;
			color: #061229;
			font-size: 1.1rem;
			font-weight: bold;
			line-height: 1;
			cursor: pointer;
		}

		.lightbox-close:hover,
		.lightbox-close:focus-visible {
			background: #ffffff;
			outline: 3px solid #ffd21f;
			outline-offset: 2px;
		}

		@media (max-width: 600px) {
			.header h1 {
				font-size: 1.3rem;
			}

			.header-logo {
				width: 46px;
				height: 46px;
			}

			.event-card {
				flex-direction: column;
			}

			.event-image-wrap {
				flex: none;
				width: 100%;
				max-height: 240px;
			}

			.event-content {
				padding: 18px;
			}

			.event-title {
				font-size: 1.15rem;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.event-button {
				transition: none;
			}
		}
	</style>
</head>

<body>

	<noscript>
		<div class="noscript-message">
			This page requires JavaScript to display current XR Lab events.
			Please enable JavaScript to see what's coming up.
		</div>
	</noscript>

	<main class="container">

		<header class="header">
			<img class="header-logo" src="assets/xr-lab-logo.png" alt="XR Lab logo" width="56" height="56" />
			<div class="header-text">
				<p class="header-eyebrow">XR Lab</p>
				<h1>Upcoming Events</h1>
			</div>
			<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode">
				<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
				<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
			</button>
		</header>

		<div id="events" class="events-list" hidden></div>

		<div id="no-events" class="notice" hidden>
			<h2>No events scheduled right now</h2>
			<p>
				New XR Lab events are on the way — check back soon.
			</p>
		</div>

		<div id="load-error" class="notice load-error" hidden>
			<h2>Unable to load events</h2>
			<p>
				There may be a formatting error in events.js. Check the file for
				a missing comma, quote, or bracket.
			</p>
		</div>

	</main>

	<div id="lightbox" class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Enlarged event flyer" hidden>
		<div class="lightbox-content">
			<button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close enlarged flyer">✕</button>
			<img id="lightbox-image" class="lightbox-image" src="" alt="">
		</div>
	</div>

	<script src="events.js"></script>

	<script>
		(function () {
			const root = document.documentElement;
			const eventsContainer = document.getElementById("events");
			const noEventsMessage = document.getElementById("no-events");
			const loadErrorMessage = document.getElementById("load-error");

			// ---------------------------------------------------------------
			// Theme toggle (only visible when the URL doesn't pin a theme)
			// ---------------------------------------------------------------

			const themeToggle = document.getElementById("theme-toggle");

			function syncToggleLabel() {
				themeToggle.setAttribute(
					"aria-label",
					root.dataset.theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
				);
			}

			themeToggle.addEventListener("click", () => {
				root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
				syncToggleLabel();
			});

			// Follow live OS theme changes until the viewer picks one manually.
			if (root.dataset.themeLocked !== "true" && window.matchMedia) {
				let userChose = false;
				themeToggle.addEventListener("click", () => { userChose = true; });
				window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
					if (!userChose) {
						root.dataset.theme = e.matches ? "dark" : "light";
						syncToggleLabel();
					}
				});
			}

			syncToggleLabel();

			// ---------------------------------------------------------------
			// Optional iframe auto-height: reports the page height to the
			// parent window so a host page can resize the iframe to fit.
			// Harmless if the host isn't listening. See README.
			// ---------------------------------------------------------------

			if (window.parent !== window && "ResizeObserver" in window) {
				const reportHeight = () => {
					window.parent.postMessage(
						{ type: "xr-lab-events:height", height: document.documentElement.scrollHeight },
						"*"
					);
				};
				new ResizeObserver(reportHeight).observe(document.body);
			}

			// ---------------------------------------------------------------
			// Lightbox
			// ---------------------------------------------------------------

			const lightbox = document.getElementById("lightbox");
			const lightboxImage = document.getElementById("lightbox-image");
			const lightboxClose = document.getElementById("lightbox-close");
			let lightboxTrigger = null;

			function handleLightboxKeydown(event) {
				if (event.key === "Escape") {
					closeLightbox();
				}
			}

			// Making <main> inert while the lightbox is open both prevents
			// Tab from reaching content behind the overlay (no separate
			// focus-trap logic needed, since the close button is the only
			// focusable element left) and hides that background content
			// from screen readers, which is what aria-modal="true" implies.
			const mainContent = document.querySelector("main");

			function openLightbox(src, alt, triggerEl) {
				lightboxTrigger = triggerEl;
				lightboxImage.src = src;
				lightboxImage.alt = alt;
				lightbox.hidden = false;
				mainContent.inert = true;
				lightboxClose.focus();
				document.addEventListener("keydown", handleLightboxKeydown);
			}

			function closeLightbox() {
				lightbox.hidden = true;
				lightboxImage.src = "";
				mainContent.inert = false;
				document.removeEventListener("keydown", handleLightboxKeydown);

				if (lightboxTrigger) {
					lightboxTrigger.focus();
				}
			}

			lightboxClose.addEventListener("click", closeLightbox);

			lightbox.addEventListener("click", event => {
				if (event.target === lightbox) {
					closeLightbox();
				}
			});

			// ---------------------------------------------------------------
			// Event rendering
			// ---------------------------------------------------------------

			// Base URL for a MyWorkshops course-code search. Used to build a
			// registration link automatically from an event's "course" field
			// when no explicit "link" is given.
			const MYWORKSHOPS_SEARCH_URL =
				"https://myworkshops.lonestar.edu/psc/elmprd/EMPLOYEE/ELM/c/LM_OD_EMPLOYEE_FL.LM_FND_LRN_FL.GBL?Page=LM_FND_LRN_RSLT_FL&Action=U&KWRD=";

			function getRegistrationLink(event) {
				if (event.link) {
					return event.link;
				}

				if (event.course) {
					return MYWORKSHOPS_SEARCH_URL + encodeURIComponent(event.course);
				}

				return null;
			}

			// Parses a "YYYY-MM-DD" string as a local calendar date instead of
			// UTC, so an event never disappears a day early for users west of
			// UTC (new Date("YYYY-MM-DD") parses as UTC midnight).
			function parseLocalDate(dateString) {
				const parts = String(dateString).split("-").map(Number);
				const [year, month, day] = parts;

				if (
					parts.length !== 3 ||
					!Number.isFinite(year) ||
					!Number.isFinite(month) ||
					!Number.isFinite(day)
				) {
					throw new Error(`Invalid date: "${dateString}". Use the format YYYY-MM-DD.`);
				}

				return new Date(year, month - 1, day);
			}

			function getToday() {
				const now = new Date();
				return new Date(now.getFullYear(), now.getMonth(), now.getDate());
			}

			function formatDisplayDate(date) {
				return date.toLocaleDateString("en-US", {
					weekday: "long",
					month: "long",
					day: "numeric",
					year: "numeric"
				});
			}

			// Small helper for building the card DOM without ever passing
			// event content through innerHTML, so a stray quote or angle
			// bracket in a title/description/link can't break the markup.
			function el(tag, options = {}) {
				const node = document.createElement(tag);

				if (options.className) {
					node.className = options.className;
				}

				if (options.text !== undefined) {
					node.textContent = options.text;
				}

				if (options.attrs) {
					for (const [name, value] of Object.entries(options.attrs)) {
						node.setAttribute(name, value);
					}
				}

				return node;
			}

			function buildDetailItem(label, value) {
				const item = el("li");
				const strong = el("strong", { text: `${label}:` });
				item.appendChild(strong);
				item.appendChild(document.createTextNode(` ${value}`));
				return item;
			}

			function buildDateBadge(date) {
				const badge = el("div", { className: "date-badge", attrs: { "aria-hidden": "true" } });
				badge.appendChild(el("span", {
					className: "date-badge-month",
					text: date.toLocaleDateString("en-US", { month: "short" })
				}));
				badge.appendChild(el("span", { className: "date-badge-day", text: String(date.getDate()) }));
				return badge;
			}

			const ZOOM_ICON =
				'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>';

			function buildEventCard(event) {
				const card = el("article", { className: "event-card" });
				const eventDate = parseLocalDate(event.date);

				if (event.image) {
					const imageWrap = el("div", { className: "event-image-wrap" });
					const trigger = el("button", {
						className: "flyer-trigger",
						attrs: {
							type: "button",
							"aria-label": `View larger flyer for ${event.title}`
						}
					});
					const image = el("img", {
						className: "event-image",
						attrs: {
							src: event.image,
							alt: "",
							loading: "lazy"
						}
					});

					trigger.appendChild(image);
					trigger.addEventListener("click", () => {
						openLightbox(event.image, event.imageAlt || event.title, trigger);
					});

					imageWrap.appendChild(trigger);

					const hint = el("span", { className: "flyer-zoom-hint", attrs: { "aria-hidden": "true" } });
					hint.innerHTML = ZOOM_ICON; // static markup, no event data
					imageWrap.appendChild(hint);

					card.appendChild(imageWrap);
				}

				const content = el("div", { className: "event-content" });

				const head = el("div", { className: "event-head" });
				head.appendChild(buildDateBadge(eventDate));
				head.appendChild(el("h3", { className: "event-title", text: event.title }));
				content.appendChild(head);

				const details = el("ul", { className: "event-details" });
				details.appendChild(buildDetailItem("Date", formatDisplayDate(eventDate)));

				if (event.time) {
					details.appendChild(buildDetailItem("Time", event.time));
				}

				if (event.location) {
					details.appendChild(buildDetailItem("Location", event.location));
				}

				if (event.course) {
					details.appendChild(buildDetailItem("Course", event.course));
				}

				content.appendChild(details);

				if (event.description) {
					content.appendChild(el("p", { className: "event-description", text: event.description }));
				}

				const registrationLink = getRegistrationLink(event);

				if (registrationLink) {
					const button = el("a", {
						className: "event-button",
						text: event.linkText || "Learn More",
						attrs: {
							href: registrationLink,
							target: "_blank",
							rel: "noopener noreferrer"
						}
					});
					button.appendChild(el("span", { className: "visually-hidden", text: " (opens in a new tab)" }));
					content.appendChild(button);
				}

				card.appendChild(content);
				return card;
			}

			function getUpcomingEvents(allEvents, today) {
				return allEvents
					.filter(event => event && event.title && event.date)
					.map(event => ({
						event,
						expirationDate: parseLocalDate(event.expires || event.date)
					}))
					.filter(({ expirationDate }) => expirationDate >= today)
					.sort((a, b) => parseLocalDate(a.event.date) - parseLocalDate(b.event.date))
					.map(({ event }) => event);
			}

			// Groups already-sorted events into consecutive runs by calendar
			// month, so the page can show a "September 2026" style heading
			// above each group without any month info being hand-maintained
			// in events.js.
			function groupByMonth(sortedEvents) {
				const groups = [];
				let currentKey = null;

				sortedEvents.forEach(event => {
					const date = parseLocalDate(event.date);
					const key = `${date.getFullYear()}-${date.getMonth()}`;

					if (key !== currentKey) {
						currentKey = key;
						groups.push({
							label: date.toLocaleDateString("en-US", { month: "long", year: "numeric" }),
							events: []
						});
					}

					groups[groups.length - 1].events.push(event);
				});

				return groups;
			}

			function renderEvents() {
				const today = getToday();

				if (typeof events === "undefined" || !Array.isArray(events)) {
					throw new Error("events.js did not define an `events` array.");
				}

				const upcomingEvents = getUpcomingEvents(events, today);

				if (upcomingEvents.length === 0) {
					eventsContainer.hidden = true;
					noEventsMessage.hidden = false;
					return;
				}

				const fragment = document.createDocumentFragment();

				groupByMonth(upcomingEvents).forEach(group => {
					fragment.appendChild(el("h2", { className: "month-heading", text: group.label }));
					group.events.forEach(event => fragment.appendChild(buildEventCard(event)));
				});

				eventsContainer.innerHTML = "";
				eventsContainer.appendChild(fragment);
				eventsContainer.hidden = false;
				noEventsMessage.hidden = true;
			}

			try {
				renderEvents();
			} catch (error) {
				console.error("Failed to render XR Lab events:", error);
				eventsContainer.hidden = true;
				noEventsMessage.hidden = true;
				loadErrorMessage.hidden = false;
			}
		})();
	</script>

</body>
</html>
